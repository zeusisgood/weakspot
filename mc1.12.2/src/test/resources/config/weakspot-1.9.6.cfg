        bow
        eat
     >

    # [クライアント] 自分のヒット音に、コンボで音を重ねるか
    B:hitChordEnabled=false

    # 1.7.x の項目（今はない）
    D:meleeWeakSpotScale=1.0

    # [サーバー] 節目にする採掘ヒットの累計
    I:milestones <
        10
        20
     >

    # [クライアント] 自分のヒット音に使うノートブロックの楽器
    S:myHitSound=BELL

    # [サーバー] 投擲物の弱点に1回当てるごとに溜まる量
    D:throwChargePerHit=0.75
}


