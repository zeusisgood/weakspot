plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = 'io.github.zeusisgood'
base.archivesName = "weakspot-${minecraft_version}-forge"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// 版に依存しない計算（common）は、各版のビルドがソースで読む
sourceSets {
    main.java.srcDir '../common/src/main/java'
    test.java.srcDir '../common/src/test/java'
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            mods {
                weakspot {
                    source sourceSets.main
                }
            }
        }
        client {
        }
        server {
            args '--nogui'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    testImplementation 'junit:junit:4.13.2'
}

// 翻訳の正本は ../lang/*.json。1.20.1 もそのまま読む
processResources {
    inputs.property 'version', version
    from('../lang') {
        include '*.json'
        into 'assets/weakspot/lang'
    }
    filesMatching('META-INF/mods.toml') {
        expand 'version': version, 'minecraft_version': minecraft_version, 'forge_version': forge_version
    }
}

jar {
    // MIT の条件（配布物に著作権表示を付ける）のため、jar にも LICENSE を入れる
    from('../LICENSE') {
        rename { 'LICENSE_weakspot' }
    }
    finalizedBy 'reobfJar'
}

test {
    // テストは、リポジトリ直下のファイル（翻訳・README・update.json など）を読む
    workingDir = file('..')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '2000'
}
