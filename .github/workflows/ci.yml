# ビルドとテスト（PR と main への push）。main で版（build.gradle の version）が新しくなったら、
# 同じビルドの jar で、タグ vX.Y.Z と GitHub Release を作る（本文は CHANGELOG.md のその版の節）。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle
      - name: Build and test
        # ForgeGradle の初回のダウンロードで Maven が一時的に断ることがあるので、1 回だけやり直す
        run: ./gradlew build --no-daemon || (sleep 60 && ./gradlew build --no-daemon)
      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: build/libs/*.jar

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: version
        run: |
          version=$(sed -n "s/^version = '\(.*\)'/\1/p" build.gradle)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "Release v$version already exists; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.new == 'true'
        with:
          name: jar
          path: jar
      - name: Create the release
        if: steps.version.outputs.new == 'true'
        run: |
          version=${{ steps.version.outputs.version }}
          # CHANGELOG.md の「## <版>」から、次の「## 」の手前まで
          awk -v v="## $version" '$0 == v {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > notes.md
          gh release create "v$version" "jar/weakspot-$version.jar" \
            --title "$version" --notes-file notes.md --target "$GITHUB_SHA"
