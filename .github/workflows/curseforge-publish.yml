# GitHub Release の jar を、手動で CurseForge に上げる（自動の公開が失敗したときや、まだ上げていない版を上げるとき）。
# CurseForge は上げ済みの版を確かめられないので、同じ版を 2 回流すと二重に上がる。流す前に CurseForge の Files を確かめる。
# Actions の画面の「Run workflow」で、版（空なら build.gradle の版）を指定して流す。
name: CurseForge publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (empty = the version in build.gradle)'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Publish
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version=$(sed -n "s/^version = '\(.*\)'/\1/p" build.gradle)
          fi
          bash .github/scripts/publish-curseforge.sh "$version"
